apiVersion: v1
kind: Service
metadata:
  name: web-app-service
  namespace: selfhealing-assignment
spec:
  type: NodePort
  selector:
    app: web-app
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30000
---
apiVersion: v1
kind: Service
metadata:
  name: web-app-clusterip
  namespace: selfhealing-assignment
spec:
  selector:
    app: web-app
  ports:
  - port: 80
    targetPort: 80
