apiVersion: v1
kind: ConfigMap
metadata:
  name: web-app-config
  namespace: selfhealing-assignment
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
        <title>Self-Healing Web Application</title>
        <style>
            body { font-family: Arial, sans-serif; margin: 40px; background-color: #f0f0f0; }
            .container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
            .status { color: green; font-weight: bold; }
            .info { background: #e7f3ff; padding: 15px; border-left: 4px solid #2196F3; margin: 15px 0; }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>Self-Healing Application</h1>
            <p class="status">Application is running and healthy!</p>
            <div class="info">
                <h3>Health Check Status:</h3>
                <ul>
                    <li><strong>Startup Probe:</strong> Passed</li>
                    <li><strong>Liveness Probe:</strong> Active</li>
                    <li><strong>Readiness Probe:</strong> Ready for traffic</li>
                </ul>
            </div>
            <p><strong>Namespace:</strong> selfhealing-assignment</p>
            <p><strong>Application:</strong> web-app</p>
        </div>
    </body>
    </html>
