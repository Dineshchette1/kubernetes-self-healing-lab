apiVersion: v1
kind: Pod
metadata:
  name: memory-hog
  namespace: selfhealing-assignment
spec:
  containers:
  - name: memory-hog-container
    image: polinux/stress
    command: ["stress"]
    args: ["--vm", "1", "--vm-bytes", "1500M", "--timeout", "600s"]
    resources:
      limits:
        memory: "900Mi"
      requests:
        memory: "900Mi"